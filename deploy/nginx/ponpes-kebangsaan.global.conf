# Optional: install on the server's global nginx when it terminates TLS and
# forwards to the Compose prod nginx container (template-nginx on app-bridge).
# Replace ponpes.ferxcode.my.id and certificate paths for your host.

server {
    listen 443 ssl http2;
    server_name ponpes.ferxcode.my.id;

    # ssl_certificate     /path/to/fullchain.pem;
    # ssl_certificate_key /path/to/privkey.pem;

    client_max_body_size 60M;

    location / {
        proxy_pass http://template-nginx:80;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }
}

server {
    listen 80;
    server_name ponpes.ferxcode.my.id;
    return 301 https://$host$request_uri;
}
