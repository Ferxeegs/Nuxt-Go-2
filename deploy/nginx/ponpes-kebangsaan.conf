# Legacy: global nginx on app-bridge proxying directly to api/web containers
# (bypasses compose nginx-prod). Prefer ponpes-kebangsaan.global.conf →
# template-nginx:80 when using the prod nginx container.

server {
    listen 80;
    server_name ponpes.ferxcode.my.id;

    client_max_body_size 60M;

    # Static uploads from the Go API.
    location /uploads/ {
        proxy_pass http://template-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }

    # Same-origin API for the Nuxt SPA (replaces the old Next.js BFF).
    location /api/ {
        proxy_pass http://template-api:8080;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }

    location / {
        proxy_pass http://template-web:3000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        proxy_read_timeout 60;
        proxy_connect_timeout 60;
        proxy_send_timeout 60;
    }

    error_log  /var/log/nginx/ponpes_kebangsaan_error.log;
    access_log /var/log/nginx/ponpes_kebangsaan_access.log;
}
