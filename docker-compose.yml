name: template

services:
  api-dev:
    profiles: ["dev"]
    container_name: template-api-dev
    build:
      context: ./backend
      target: dev
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./backend:/app                # bind mount source code -> hot reload
      - /app/tmp                      # exclude air's build tmp dir from host
      - ./backend/storage/uploads:/app/storage/uploads
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - app-bridge

  web-dev:
    profiles: ["dev"]
    container_name: template-web-dev
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    env_file:
      - path: ./.env
        required: false
    environment:
      API_URL: http://api-dev:8080
      # Windows/macOS Docker bind mounts don't emit inotify; Vite polls instead.
      CHOKIDAR_USEPOLLING: "true"
    volumes:
      - ./frontend:/frontend
      - template-web-node-modules:/frontend/node_modules
      # Anonymous volume: fresh .nuxt per container create. A named volume was
      # keeping stale generated routes across recreates and contributed to
      # client 404s for newly added pages until a hard restart.
      - /frontend/.nuxt
    # No depends_on api-dev: the SPA only calls the API from the browser (via
    # nginx), so starting in parallel with the Go build cuts cold-start time.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 90s
    networks:
      - app-bridge

  nginx:
    profiles: ["dev"]
    container_name: template-nginx-dev
    image: public.ecr.aws/docker/library/nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./deploy/nginx/ponpes-kebangsaan.dev.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api-dev:
        condition: service_healthy
      web-dev:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-bridge

  api:
    profiles: ["prod"]
    container_name: template-api
    build:
      context: ./backend
      target: prod
    env_file:
      - path: ./.env
        required: false
    volumes:
      - ./backend/storage/uploads:/app/storage/uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 15s
    networks:
      - app-bridge

  web:
    profiles: ["prod"]
    container_name: template-web
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        NUXT_PUBLIC_SITE_URL: ${NUXT_PUBLIC_SITE_URL}
        NUXT_PUBLIC_API_URL: ${NUXT_PUBLIC_API_URL}
        NUXT_PUBLIC_TURNSTILE_SITE_KEY: ${NUXT_PUBLIC_TURNSTILE_SITE_KEY}
    env_file:
      - path: ./.env
        required: false
    environment:
      API_URL: http://api:8080
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000"]
      interval: 15s
      timeout: 3s
      retries: 5
      start_period: 20s
    networks:
      - app-bridge

  nginx-prod:
    profiles: ["prod"]
    container_name: template-nginx
    image: public.ecr.aws/docker/library/nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./deploy/nginx/ponpes-kebangsaan.prod.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      api:
        condition: service_healthy
      web:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app-bridge

  template_rustfs:
    # S3-compatible object storage (RustFS).
    image: rustfs/rustfs:latest
    container_name: template_rustfs
    ports:
      - "${RUSTFS_API_PORT:-9020}:9000"
      - "${RUSTFS_CONSOLE_PORT:-9021}:9001"
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_SECRET_KEY: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin123}
      RUSTFS_CONSOLE_ENABLE: "true"
    volumes:
      - template_rustfs_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:9000/health"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped
    networks:
      app-bridge:
        # RustFS rejects Host headers containing "_" ("invalid hostname"), but
        # the container_name (used as the default DNS name) has one — give it
        # an extra underscore-free alias and use THAT in every URL that talks
        # to RustFS (S3_ENDPOINT_URL, storage/scripts/init-rustfs.sh).
        aliases:
          - template-rustfs-svc

  template_rustfs_init:
    image: amazon/aws-cli:latest
    container_name: template_rustfs_init
    depends_on:
      template_rustfs:
        condition: service_healthy
    environment:
      RUSTFS_ROOT_USER: ${RUSTFS_ROOT_USER:-rustfsadmin}
      RUSTFS_ROOT_PASSWORD: ${RUSTFS_ROOT_PASSWORD:-rustfsadmin123}
      RUSTFS_SITE_REGION: ${RUSTFS_SITE_REGION:-us-east-1}
      RUSTFS_DEFAULT_BUCKET: ${RUSTFS_DEFAULT_BUCKET:-template-documents}
      RUSTFS_PUBLIC_BUCKET: ${RUSTFS_PUBLIC_BUCKET:-template-public-documents}
      RUSTFS_HOST: template-rustfs-svc
    volumes:
      - ./storage/scripts/init-rustfs.sh:/init-rustfs.sh:ro
    entrypoint: ["/bin/sh", "/init-rustfs.sh"]
    networks:
      - app-bridge

networks:
  app-bridge:
    external: true                    # same network as the shared MySQL & Redis containers
    name: app-bridge                  # match the name of your existing shared infra network

volumes:
  template-web-node-modules:
  template_rustfs_data:
