root = "."
tmp_dir = "tmp"

[build]
  cmd = "go build -o ./tmp/server ./cmd/api"
  bin = "./tmp/server"
  full_bin = "./tmp/server"
  include_ext = ["go", "yaml", "yml", "env"]
  exclude_dir = ["tmp", "storage", "docs", ".git"]
  delay = 1000
  stop_on_error = true

[log]
  time = true

[misc]
  clean_on_exit = true
